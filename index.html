  <style>
    :root {
      color-scheme: dark;
      --white: #f7f8fb;
      --muted: rgba(247,248,251,.76);
      --line: rgba(255,255,255,.24);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background: #080b12;
      overflow-x: hidden;
    }
    .wallpaper {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      filter: brightness(.72) saturate(.92);
      transform: scale(1.015);
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(3,6,12,.48) 0%, rgba(3,6,12,.05) 34%, rgba(3,6,12,.28) 58%, rgba(3,6,12,.88) 100%),
        linear-gradient(90deg, rgba(3,6,12,.55) 0%, rgba(3,6,12,.08) 70%);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: clamp(1.2rem, 4vw, 2.6rem) clamp(1.2rem, 5vw, 4rem);
    }
    .wordmark {
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--muted);
      font-size: .76rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .status::before {
      content: "";
      width: .45rem;
      height: .45rem;
      border-radius: 50%;
      background: #91e7bc;
      box-shadow: 0 0 16px rgba(145,231,188,.8);
    }
    main {
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: flex-end;
      padding: clamp(1.5rem, 7vw, 6.5rem) clamp(1.2rem, 5vw, 4rem) clamp(2rem, 7vh, 5rem);
    }
    .intro {
      width: min(760px, 100%);
      animation: rise .9s ease-out both;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: 0 0 1.15rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      display: block;
      width: 2.4rem;
      height: 1px;
      background: rgba(255,255,255,.8);
    }
    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(3.3rem, 10vw, 7.8rem);
      line-height: .88;
      letter-spacing: -.075em;
      font-weight: 800;
      text-wrap: balance;
      text-shadow: 0 8px 40px rgba(0,0,0,.24);
    }
    .description {
      max-width: 36rem;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 2rem;
    }
    .action {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      padding: .85rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--white);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font: inherit;
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .action.primary {
      color: #10131a;
      border-color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.94);
    }
    .action:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.17);
      border-color: rgba(255,255,255,.65);
    }
    .action.primary:hover { background: #fff; }
    .arrow { font-size: 1.15rem; line-height: 1; }
    footer {
      position: absolute;
      right: clamp(1.2rem, 5vw, 4rem);
      bottom: 1.4rem;
      color: rgba(255,255,255,.62);
      font-size: .72rem;
      letter-spacing: .08em;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .wallpaper { object-position: 48% center; }
      .veil {
        background:
          linear-gradient(180deg, rgba(3,6,12,.25) 0%, rgba(3,6,12,.04) 25%, rgba(3,6,12,.4) 48%, rgba(3,6,12,.94) 100%),
          linear-gradient(90deg, rgba(3,6,12,.22), transparent);
      }
      main { min-height: calc(100svh - 80px); padding-bottom: 4.5rem; }
      .status { font-size: .64rem; letter-spacing: .08em; }
      footer { position: static; padding: 0 1.2rem 1.2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
